<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reactive Fiber Orb</title>
<style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; }
    .hint {
        position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
        font-family: 'Helvetica Neue', sans-serif; font-size: 12px;
        letter-spacing: 4px; color: rgba(255,255,255,0.75);
        pointer-events: none; z-index: 10; text-transform: uppercase;
    }
    #err {
        position: fixed; top: 8px; left: 8px; z-index: 99;
        color: #ff5555; background: rgba(0,0,0,0.75);
        font: 11px/1.5 monospace; white-space: pre-wrap;
        max-width: 90vw; max-height: 40vh; overflow: auto;
        display: none; padding: 8px;
    }
</style>
<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>
</head>
<body>
<div class="hint">Move cursor over orb · Press B to toggle bloom</div>
<div id="err"></div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const errDiv = document.getElementById('err');
function showErr(msg){ errDiv.style.display = 'block'; errDiv.textContent += msg + '\n'; }
const origErr = console.error.bind(console);
console.error = (...a) => { showErr(a.map(String).join(' ')); origErr(...a); };
window.addEventListener('error', e => showErr('JS ERROR: ' + e.message));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0, 5.6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.debug.checkShaderErrors = true;
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const NOISE_GLSL = `
float hash12(vec2 p){
    vec3 p3 = fract(vec3(p.xyx) * 0.1031);
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.x + p3.y) * p3.z);
}
float vnoise(vec2 p){
    vec2 i = floor(p);
    vec2 f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    float a = hash12(i);
    float b = hash12(i + vec2(1.0, 0.0));
    float c = hash12(i + vec2(0.0, 1.0));
    float d = hash12(i + vec2(1.0, 1.0));
    return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
float fbm(vec2 p){
    float v = 0.0;
    float a = 0.5;
    for(int i = 0; i < 4; i++){
        v += a * vnoise(p);
        p = p * 2.03 + vec2(0.31);
        a *= 0.5;
    }
    return v;
}
`;

/* ================= 背景 ================= */
const bgMat = new THREE.ShaderMaterial({
    depthWrite: false,
    vertexShader: `
        varying vec2 vUv;
        void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.999, 1.0); }`,
    fragmentShader: `
        varying vec2 vUv;
        ${NOISE_GLSL}
        void main(){
            float g = smoothstep(-0.15, 1.0, vUv.y + (vUv.x - 0.5) * -0.35);
            vec3 col = mix(vec3(0.70, 0.68, 0.94), vec3(0.15, 0.78, 0.74), g);
            float r = length((vUv - 0.5) * vec2(2.1, 1.9));
            col += vec3(0.10, 0.14, 0.14) * exp(-r * r * 3.0);
            col += (hash12(vUv * 913.7) - 0.5) * 0.02;
            gl_FragColor = vec4(col, 1.0);
        }`
});
const bg = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat);
bg.frustumCulled = false;
bg.renderOrder = -1;
scene.add(bg);

/* ================= 球体 ================= */
const uniforms = {
    uTime:     { value: 0 },
    uHit:      { value: new THREE.Vector3(-0.55, 0.35, 0.75).normalize() },
    uStrength: { value: 1.0 },
    uMouse:    { value: new THREE.Vector3(0.6, -0.4, 0.7).normalize() },
    uMouseStr: { value: 0.0 },
    uWave:     { value: 0.8 }
};

const orbMat = new THREE.ShaderMaterial({
    uniforms,
    vertexShader: `
        uniform vec3 uHit;
        varying vec3 vPos;
        varying vec3 vWorldPos;
        varying vec3 vWorldNormal;
        void main(){
            vec3 nrm = normalize(position);
            vec3 Hv = normalize(uHit);
            float dHv = distance(nrm, Hv);

            float tt = clamp((dHv - 0.08) / 0.28, 0.0, 1.0);
            float ss = tt * tt * (3.0 - 2.0 * tt);
            float cc = 1.0 - ss;
            float depth = 0.10 * cc * cc;
            vec3 pos = position * (1.0 - depth);

            float dsdt = 6.0 * tt * (1.0 - tt);
            float dDepth = -0.10 * 2.0 * cc * dsdt / 0.28;
            vec3 gradDir = normalize(Hv - nrm * dot(Hv, nrm) + vec3(0.0001));
            vec3 nPert = normalize(nrm + gradDir * (-dDepth) * 0.5);

            vPos = pos;
            vWorldNormal = normalize(mat3(modelMatrix) * nPert);
            vec4 wp = modelMatrix * vec4(pos, 1.0);
            vWorldPos = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
        }`,
    fragmentShader: `
        uniform float uTime;
        uniform vec3  uHit;
        uniform float uStrength;
        uniform vec3  uMouse;
        uniform float uMouseStr;
        uniform float uWave;
        varying vec3 vPos;
        varying vec3 vWorldPos;
        varying vec3 vWorldNormal;
        ${NOISE_GLSL}

        float hexSDF(vec2 p){
            vec2 q = abs(p);
            return max(dot(q, vec2(0.8660254, 0.5)), q.y) - 1.0;
        }
        vec3 hexInfo(vec2 p){
            vec2 s = vec2(3.4641016, 2.0);
            vec2 o = vec2(1.7320508, 1.0);
            vec2 c1 = floor(p / s + 0.5) * s;
            vec2 c2 = floor((p - o) / s + 0.5) * s + o;
            float d1 = hexSDF(p - c1);
            float d2 = hexSDF(p - c2);
            float pick1 = step(abs(d1), abs(d2));
            return vec3(mix(c2, c1, pick1), mix(d2, d1, pick1));
        }
        float hexD(vec2 p){ return hexInfo(p).z; }

        void main(){
            vec3 n = normalize(vPos);
            vec3 wn = normalize(vWorldNormal);
            vec3 viewDir = normalize(cameraPosition - vWorldPos);
            float fres = pow(clamp(1.0 - abs(dot(viewDir, wn)), 0.0, 1.0), 2.0);
            float str = clamp(uStrength, 0.0, 1.3);
            vec3 H = normalize(uHit);
            float dH = distance(n, H);

            /* ===== 1. 玻璃水底 ===== */
            vec3 L1 = normalize(vec3(-0.5, 0.5, 0.4));
            float dif1 = clamp(dot(wn, L1) * 0.5 + 0.5, 0.0, 1.0);

            vec3 col = vec3(0.09, 0.55, 0.56);
            col = mix(col, vec3(0.38, 0.84, 0.82), pow(dif1, 1.8) * 0.55);
            col *= 0.92 + 0.18 * smoothstep(0.30, 0.70, fbm(n.xy * 2.0 + 7.7));

            float dif2 = clamp(dot(wn, normalize(vec3(-0.6, -0.5, 0.3))) * 0.5 + 0.5, 0.0, 1.0);
            col = mix(col, vec3(0.70, 0.62, 0.92), pow(dif2, 1.6) * 0.70);
            col = mix(col, vec3(0.70, 0.80, 0.55),
                      0.40 * smoothstep(0.50, 0.75, fbm(n.yz * 1.3 + 9.2)));

            col += vec3(0.3, 0.7, 0.7) * fbm(n.xy * 3.0 + uTime * 0.15) * 0.06;

            vec3 Lg = normalize(vec3(0.45, 0.35, 0.75));
            float sheen = pow(clamp(dot(wn, Lg), 0.0, 1.0), 3.0);
            col += vec3(0.9, 1.0, 1.0) * sheen * 0.16;
            float spec2 = pow(clamp(dot(reflect(-viewDir, wn), Lg), 0.0, 1.0), 40.0);
            col += vec3(1.0) * spec2 * 0.25;

            float rimR = 0.35 + 0.65 * smoothstep(-0.3, 0.9, wn.x);
            col += vec3(0.55, 1.0, 0.97) * pow(fres, 2.5) * rimR * 0.7;

            /* ===== 2. 光环波 ===== */
            float startD = 0.60;
            float d2 = max(dH - startD, 0.0);
            float period = 1.2;
            float p = mod(uTime * 0.5 - d2, period);
            float ringProf = smoothstep(0.0, 0.12, p) * (1.0 - smoothstep(0.30, 0.55, p));
            ringProf *= smoothstep(0.0, 0.15, d2);
            ringProf *= 1.0 - smoothstep(1.4, 2.0, d2);
            ringProf *= 0.5 + 0.9 * uWave;

            col += vec3(0.7, 1.0, 1.0) * ringProf * 0.025;

            /* ===== 3. 光标反应：暗 + 彩虹涟漪 ===== */
            float dM = distance(n, normalize(uMouse));
            float mGlow = (1.0 - smoothstep(0.1, 0.6, dM)) * uMouseStr;
            float mHue = uTime * 0.15 + dM * 1.2;
            vec3 mouseCol = 0.5 + 0.5 * cos(6.28318 * (mHue + vec3(0.0, 0.33, 0.67)));
            mouseCol = clamp(mouseCol, 0.15, 1.0);
            col += mouseCol * mGlow * 0.10;   // 只加一点点彩色微光

            /* ===== 4. 蜂窝：边线发光 ===== */
            float uu = atan(n.z, n.x);
            float vv = asin(clamp(n.y, -1.0, 1.0));
            vec2 hexUV = vec2(uu, vv) * 26.0;
            vec3 hi = hexInfo(hexUV);
            vec2 cid = hi.xy;
            float hd = hi.z;

            float edge = 1.0 - smoothstep(0.0, 0.10, abs(hd));
            float cellRnd = hash12(cid * 0.371);

            vec2 eOff = vec2(0.12, 0.10);
            float bevel = clamp((hexD(hexUV - eOff) - hexD(hexUV + eOff)) * 1.5, -1.0, 1.0);
            float edgeLit  = edge * max(bevel, 0.0);

            float height = 1.0 - smoothstep(-0.55, -0.05, hd);

            float revealBase = 0.10 + 0.35 * smoothstep(0.40, 0.75,
                             fbm(n.xy * 1.8 + n.z * 1.3 + 4.7));
            revealBase = max(revealBase, pow(fres, 1.5) * 0.35);

            float suppress = (1.0 - smoothstep(0.15, 0.60, dH)) * str;
            float reveal = revealBase * (1.0 - suppress * 0.9);

            col += vec3(0.55, 0.95, 0.95) * height * (0.05 + 0.09 * max(bevel, 0.0))
                   * (0.4 + 0.6 * reveal + ringProf * 0.4);

            float hexBright = reveal * (0.6 + 0.4 * cellRnd)
                            + ringProf * 0.8 * (0.8 + 0.4 * cellRnd);
            hexBright *= 1.0 + mGlow * 0.5;   // 鼠标提亮减半

            col = mix(col, vec3(0.85, 1.0, 1.0), clamp(edgeLit * hexBright, 0.0, 1.0));
            col += vec3(0.85, 1.0, 1.0) * edge * hexBright * 0.35;

            // 光标附近：边线染成流动的彩虹色（不炸白）
            col = mix(col, mouseCol, clamp(edge * mGlow, 0.0, 1.0) * 0.6);

            vec2 duv = hexUV * 5.0;
            float dl = length(fract(duv) - 0.5);
            float dots = 1.0 - smoothstep(0.15, 0.30, dl);
            float dotMask = step(0.60, cellRnd) * (1.0 - edge);
            col += vec3(0.9, 1.0, 1.0) * dots * dotMask * (0.05 + 0.05 * ringProf);

            /* ===== 5. 高饱和五彩发丝 ===== */
            vec3 upv = vec3(0.0, 1.0, 0.0);
            if (abs(H.y) > 0.9) { upv = vec3(1.0, 0.0, 0.0); }
            vec3 t1 = normalize(cross(H, upv) + vec3(0.0001));
            vec3 t2 = normalize(cross(H, t1) + vec3(0.0001));
            float ang = atan(dot(n, t2), dot(n, t1));

            float rays = 320.0;
            float aBase = ang / 6.2831853 * rays + uTime * 0.2 + dH * 1.2;
            float id = floor(aBase);
            float rnd = hash12(vec2(id, 7.31));

            float bow = (vnoise(vec2(id * 1.7, 3.3)) - 0.5) * 2.0;
            float wig = (vnoise(vec2(id * 5.1, dH * 9.0 - uTime * 4.0)) - 0.5) * 2.0;
            float ripple = sin(dH * 18.0 - uTime * 4.0 + id * 1.3) * 0.35;
            float grow = smoothstep(0.10, 0.7, dH);
            float a = aBase + (bow * 3.0 + wig * 1.4 + ripple) * grow;
            float fr = fract(a) - 0.5;

            float width = 0.22 + 0.34 * hash12(vec2(id, 2.2));
            float fiberWide = 1.0 - smoothstep(width * 0.4, width, abs(fr));
            float fiberCore = 1.0 - smoothstep(width * 0.10, width * 0.30, abs(fr));
            float fiberHalo = 1.0 - smoothstep(width * 0.8, width * 2.0, abs(fr));
            float rimF = max(fiberWide - fiberCore, 0.0);

            float len = 0.35 + rnd * 0.40;
            float env = smoothstep(0.10, 0.16, dH) * (1.0 - smoothstep(len * 0.7, len, dH));

            float flick = 0.7 + 0.3 * sin(uTime * 5.0 + rnd * 40.0);
            float strandB = (0.25 + 0.75 * hash12(vec2(id, 9.4))) * flick;
            float flow = 0.6 + 0.8 * vnoise(vec2(id * 3.7, dH * 10.0 - uTime * 4.5));
            float travel = 0.55 + 0.45 * sin(dH * 26.0 - uTime * 7.0 + id * 0.7);
            float prox = 0.4 + 0.5 * (1.0 - smoothstep(0.15, 0.55, dH));
            float burstBase = env * strandB * flow * travel * prox * str;

            float hue = rnd + dH * 0.35 + uTime * 0.05;
            vec3 strandCol = 0.50 + 0.50 * cos(6.28318 * (hue + vec3(0.00, 0.30, 0.60)));
            strandCol = clamp(strandCol, 0.10, 1.0);
            strandCol = pow(strandCol, vec3(1.2));
            vec3 fiberCol = mix(vec3(0.90, 0.95, 1.00), strandCol, smoothstep(0.06, 0.22, dH));
            vec3 rimCol = mix(strandCol, vec3(0.55, 0.40, 1.00), 0.35);

            col += strandCol * fiberHalo * burstBase * 0.45;
            col += fiberCol * fiberWide * burstBase * 1.3;
            col += vec3(1.0) * fiberCore * burstBase * 0.6;
            col += rimCol * rimF * burstBase * 1.2;

            vec2 sp = vec2(ang * 15.0, dH * 35.0);
            vec2 spId = floor(sp);
            vec2 spF = fract(sp) - 0.5;
            float spRnd = hash12(spId);
            float sparkle = step(0.93, spRnd) * (1.0 - smoothstep(0.05, 0.30, length(spF)));
            sparkle *= env * str * (0.5 + 0.5 * sin(uTime * 6.0 + spRnd * 40.0));
            col += mix(vec3(1.0), strandCol, 0.7) * sparkle * 1.2;

            /* ===== 6. 浅凹瞳孔 ===== */
            float holeMask = 1.0 - smoothstep(0.12, 0.20, dH);
            vec3 holeCol = mix(vec3(0.06, 0.36, 0.40), vec3(0.12, 0.52, 0.55),
                               smoothstep(0.0, 0.18, dH));
            col = mix(col, holeCol, holeMask * 0.9);

            col = min(col, vec3(1.0));
            gl_FragColor = vec4(col, 1.0);
        }`
});

const orb = new THREE.Mesh(new THREE.SphereGeometry(1.5, 196, 196), orbMat);
scene.add(orb);

/* ================= 后期 ================= */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.20, 0.4, 0.80);
composer.addPass(bloom);
addEventListener('keydown', e => {
    if (e.key === 'b' || e.key === 'B') bloom.enabled = !bloom.enabled;
});

/* ================= 交互（充能上限降低） ================= */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const targetMouse = uniforms.uMouse.value.clone();
let mouseTarget = 0, waveTarget = 0.8, hovering = false, lastX = 0, lastY = 0;

addEventListener('pointermove', (e) => {
    pointer.x = (e.clientX / innerWidth) * 2 - 1;
    pointer.y = -(e.clientY / innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObject(orb, false);
    const speed = Math.hypot(e.clientX - lastX, e.clientY - lastY);
    if (hits.length) {
        hovering = true;
        targetMouse.copy(orb.worldToLocal(hits[0].point.clone()).normalize());
        mouseTarget = Math.min(0.7, mouseTarget + 0.03 + speed * 0.006);  // 上限 1.2→0.7
        waveTarget  = Math.min(1.6, waveTarget + speed * 0.015);
    } else hovering = false;
    lastX = e.clientX; lastY = e.clientY;
});

/* ================= 动画 ================= */
const clock = new THREE.Clock();
function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    uniforms.uTime.value = t;

    mouseTarget *= hovering ? 0.97 : 0.93;
    uniforms.uMouseStr.value += (mouseTarget - uniforms.uMouseStr.value) * 0.1;
    uniforms.uMouse.value.lerp(targetMouse, 0.2).normalize();

    waveTarget = Math.max(0.8, waveTarget * 0.985);
    uniforms.uWave.value += (waveTarget - uniforms.uWave.value) * 0.05;

    orb.position.y = Math.sin(t * 0.5) * 0.05;

    camera.position.x += (pointer.x * 0.25 - camera.position.x) * 0.04;
    camera.position.y += (pointer.y * 0.18 - camera.position.y) * 0.04;
    camera.lookAt(0, 0, 0);

    composer.render();
}
animate();

addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
